
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Conference Registration Form</h1>
    <form action="">
        Full Name: <br>
        <input type="text" name="fullname" placeholder="Enter your full name"> <br>
        Emaill Address: <br>
        <input type="email" name="email" placeholder="Enter your email address">
        <br>
        Age: <br>
        <input type="number" placeholder="18"> 
        <br><br>
        Gender: <br><br>
        <input type="radio" name="gender" value="male">Male <br>
        <input type="radio" name="gender" value="female">Female <br>
       <br>
        Country of Residence: <br>
        <select name="" id="">
            <option value="malaysia">Malaysia</option>
            <option value="singapore">Singapore</option>
            <option value="brunei">Brunei</option>
            <option value="japan">Japan</option>
        </select>
        <br><br>
        Area of Interest: <br>
        <input type="checkbox" name="aoi1" value="software development">Software Development <br>
        <input type="checkbox" name="aoi2" value="data science">Data Science <br>
        <input type="checkbox" name="aoi3" value="cybersecurity">Cybersecurity <br>
        <input type="checkbox" name="aoi4" value="artificial intelligence">Artificial Intelligence <br>
        <br>
        Experience Level: <br>
        <input type="radio" value="beginner">Beginner <br>
        <input type="radio" value="intermediate">Intermediate <br>
        <input type="radio" value="advanced">Advanced <br>
        <br>
        Comments or Questions: <br>
        <textarea name="comment" id="comment" placeholder="Any comments or questions" rows="4" cols="50"></textarea> <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

</body>
</html>
